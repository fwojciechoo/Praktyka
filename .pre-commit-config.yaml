repos:
  - repo: local
    hooks:
      - id: pytest
        name: Pytest
        entry: pytest
        language: system
        stages:
          - pre-commit
        pass_filenames: false

      - id: pyright
        name: Pyright
        entry: pyright
        language: system
        stages:
          - pre-commit
        pass_filenames: false

      - id: check-commit-message
        name: Check commit message
        entry: python scripts/check-commit-message.py
        language: system
        stages:
          - commit-msg